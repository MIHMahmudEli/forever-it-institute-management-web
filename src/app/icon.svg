<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      .icon-bracket { fill: none; stroke: #D81A22; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .icon-f { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 54px; fill: #FFFFFF; }
      .icon-i-stem { fill: #006838; }
      .icon-i-dot { fill: #D81A22; }
      .icon-t { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 54px; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Dark Rich Forest Green Background with Subtle Rounded Corners -->
  <rect width="128" height="128" rx="28" fill="#015333" />

  <!-- Inner subtle border -->
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#006838" stroke-width="2" />

  <!-- Stylized Red Frame Brackets -->
  <path d="M 32 28 L 18 28 L 18 100 L 32 100" class="icon-bracket" />
  <path d="M 96 28 L 110 28 L 110 100 L 96 100" class="icon-bracket" />

  <!-- F Text -->
  <text x="24" y="86" class="icon-f">F</text>

  <!-- Stylized I (Green stem + Red dot) -->
  <rect x="58" y="44" width="12" height="42" rx="3" fill="#22C55E" />
  <circle cx="64" cy="33" r="7.5" fill="#D81A22" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- T Text -->
  <text x="76" y="86" class="icon-t">T</text>
</svg>
